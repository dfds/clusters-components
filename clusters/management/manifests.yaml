apiVersion: v1
kind: Namespace
metadata:
  name: ${namespace}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: NodeadmConfig
metadata:
  name: ${name}-pool-0
  namespace: ${namespace}
spec: {}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: ${name}
    cluster.x-k8s.io/cluster-purpose: management
  name: ${name}
  namespace: ${namespace}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: AWSManagedControlPlane
    name: ${name}-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSManagedCluster
    name: ${name}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: ${name}-pool-0
  namespace: ${namespace}
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "3"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
spec:
  clusterName: ${name}
  replicas: 2
  template:
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: NodeadmConfig
          name: ${name}-pool-0
      clusterName: ${name}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSManagedMachinePool
        name: ${name}-pool-0
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: AWSManagedControlPlane
metadata:
  name: ${name}-control-plane
  namespace: ${namespace}
spec:
  addons:
  - name: vpc-cni
    version: v1.22.4-eksbuild.3
  - name: coredns
    version: v1.14.3-eksbuild.3
  - name: kube-proxy
    version: v1.36.0-eksbuild.14
  - name: eks-pod-identity-agent
    version: v1.3.10-eksbuild.3
  associateOIDCProvider: true
  accessConfig:
    authenticationMode: api_and_config_map
    bootstrapClusterCreatorAdminPermissions: true
  accessEntries:
  - principalARN: arn:aws:iam::${accountId}:role/controllers.cluster-api-provider-aws.sigs.k8s.io
    type: standard
    accessPolicies:
    - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
      accessScope:
        type: cluster
  region: ${region}
  sshKeyName: default
  version: 1.37.1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSManagedCluster
metadata:
  name: ${name}
  namespace: ${namespace}
spec: {}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSManagedMachinePool
metadata:
  name: ${name}-pool-0
  namespace: ${namespace}
spec:
  amiType: AL2023_x86_64_STANDARD
  amiVersion: 1.37.1-20261112
  scaling:
    maxSize: 3
    minSize: 1
