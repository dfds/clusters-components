---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-api-operator
  namespace: capi-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: cluster-api-operator
      version: "0.30.0"
      sourceRef:
        kind: HelmRepository
        name: cluster-api-operator
        namespace: capi-operator
      interval: 15m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  install:
    crds: Skip
  values:
    core:
      cluster-api:
        createNamespace: true
        version: v1.14.3
    bootstrap:
      kubeadm:
        createNamespace: true
        version: v1.14.3
    controlPlane:
      kubeadm:
        createNamespace: true
        version: v1.14.3
    infrastructure:
      aws:
        namespace: capa-system
        createNamespace: false
        version: v2.13.1
        configSecret:
          name: aws-credentials
        manager:
          featureGates:
            MachinePool: true
            EKSEnableIAM: true
            EKSAllowAddRoles: true
    addon:
      helm:
        createNamespace: true
        version: v0.6.4

