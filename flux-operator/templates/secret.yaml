---
apiVersion: v1
kind: Secret
metadata:
  name: ${name}
  namespace: ${namespace}
type: addons.cluster.x-k8s.io/resource-set
stringData:
  secret.yaml: |
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: githubapp
      namespace: flux-system
    type: Opaque
    data:
      githubAppID: ${github_app_id}
      githubAppInstallationID: ${github_app_installation_id}
      githubAppPrivateKey: |
        ${github_app_private_key}